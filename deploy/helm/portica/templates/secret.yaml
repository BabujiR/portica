{{- if not .Values.secrets.existingSecret }}
{{- $s := .Values.secrets }}
{{- $dev := dict "dbPassword" "portica" "clickhousePassword" "portica" "internalToken" "portica-internal-dev-token" "gatewayClientSecret" "portica-gateway-dev-secret" "portalClientSecret" "portica-portal-dev-secret" "kvmEncryptionKey" "o1r8cXTayN7WvWNLZ8JMcwDzlrd05HPoHb9/reetxkQ=" }}
{{- range $key, $devValue := $dev }}
{{- $value := index $s $key }}
{{- if and (not $.Values.allowDevSecrets) (or (not $value) (eq $value $devValue)) }}
{{- if or (ne $key "kvmEncryptionKey") (eq $.Values.secretsProvider.type "local") }}
{{- fail (printf "secrets.%s must be set to a non-development value (or use secrets.existingSecret, or allowDevSecrets=true for a throwaway cluster)" $key) }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "portica.secretName" . }}
  labels:
    {{- include "portica.labels" (dict "root" . "name" "secrets") | nindent 4 }}
type: Opaque
stringData:
  db-password: {{ default (get $dev "dbPassword") $s.dbPassword | quote }}
  clickhouse-password: {{ default (get $dev "clickhousePassword") $s.clickhousePassword | quote }}
  internal-token: {{ default (get $dev "internalToken") $s.internalToken | quote }}
  gateway-client-secret: {{ default (get $dev "gatewayClientSecret") $s.gatewayClientSecret | quote }}
  portal-client-secret: {{ default (get $dev "portalClientSecret") $s.portalClientSecret | quote }}
  kvm-encryption-key: {{ default (get $dev "kvmEncryptionKey") $s.kvmEncryptionKey | quote }}
  {{- with $s.vaultToken }}
  vault-token: {{ . | quote }}
  {{- end }}
{{- end }}
