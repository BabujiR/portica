name: Load test

# Runs the gateway latency simulation against the docker compose stack. Manual, or nightly.
on:
  workflow_dispatch:
    inputs:
      rps:
        description: Requests per second through the gateway
        default: "200"
      duration:
        description: Seconds at full rate
        default: "60"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  gatling:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the services
        run: mvn -B -ntp package -DskipTests
      - name: Start Portica
        run: |
          docker compose --profile app up -d --build
          for i in $(seq 1 90); do
            curl -sf http://localhost:8081/actuator/health/readiness && curl -sf http://localhost:8080/actuator/health/readiness && break
            sleep 5
          done
      - name: Seed the load-test API
        id: seed
        run: |
          OUT=$(portica-loadtest/seed.sh)
          echo "$OUT"
          echo "key=$(echo "$OUT" | sed -n 's/^API_KEY=//p')" >> "$GITHUB_OUTPUT"
      - name: Gatling
        run: |
          mvn -B -ntp -Pload-test -pl portica-loadtest gatling:test \
            -DapiKey=${{ steps.seed.outputs.key }} -Drps=${{ inputs.rps || '200' }} -Dduration=${{ inputs.duration || '60' }}
      - name: Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatling-report
          path: portica-loadtest/target/gatling/
      - name: Logs
        if: failure()
        run: docker compose --profile app logs --tail=200 gateway management
