name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Java build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Testcontainers (PostgreSQL, Redis, Kafka, ClickHouse, Vault) uses the runner's Docker
      - name: Build and test
        run: mvn -B -ntp verify
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/"
          retention-days: 7
      - name: Keep the jars for the image build
        uses: actions/upload-artifact@v4
        with:
          name: jars
          path: portica-*/target/portica-*.jar
          retention-days: 3

  console:
    name: Console build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: portica-console
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: portica-console/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  helm:
    name: Helm chart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - run: helm lint deploy/helm/portica --set allowDevSecrets=true
      - name: Render (defaults and TLS + Vault)
        run: |
          helm template portica deploy/helm/portica --set allowDevSecrets=true > /dev/null
          helm template portica deploy/helm/portica --set secrets.existingSecret=portica \
            --set secretsProvider.type=vault --set gateway.tls.enabled=true > /dev/null
      - name: Development secrets are refused
        run: |
          if helm template portica deploy/helm/portica > /dev/null 2>&1; then
            echo "expected the chart to refuse development secrets"; exit 1
          fi

  loadtest-compile:
    name: Load test compiles
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B -ntp -Pload-test -pl portica-loadtest -am test-compile -DskipTests

  images:
    name: Container images
    if: github.event_name == 'push'
    needs: [backend, console, helm]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        module: [management, gateway, ai-gateway, mcp, analytics, portal, console]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: matrix.module != 'console'
        with:
          name: jars
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/portica-${{ matrix.module }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha
      - uses: docker/build-push-action@v6
        with:
          context: portica-${{ matrix.module }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.module }}
          cache-to: type=gha,mode=max,scope=${{ matrix.module }}
