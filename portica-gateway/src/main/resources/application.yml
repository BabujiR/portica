server:
  port: 8081
  shutdown: graceful

spring:
  application:
    name: portica-gateway
  data:
    redis:
      host: ${PORTICA_REDIS_HOST:localhost}
      port: ${PORTICA_REDIS_PORT:6379}
      timeout: 2s
  cloud:
    gateway:
      metrics:
        enabled: true
      server:
        webflux:
          httpclient:
            # defaults; each deployed revision overrides these with its own timeouts
            connect-timeout: 5000
            response-timeout: 30s

portica:
  gateway:
    management-url: ${PORTICA_MANAGEMENT_URL:http://localhost:8080}
    # "*" = every environment; or e.g. ["acme/*"] or ["acme/prod", "globex/prod"]
    environments: "${PORTICA_GATEWAY_ENVIRONMENTS:*}"
    sync:
      enabled: true
      poll-interval: 5s
      timeout: 10s
    policy:
      store: redis                 # redis (shared by all instances) or memory (single instance)
      max-request-body-bytes: 10485760
      max-response-body-bytes: 10485760
      trust-forwarded-for: false   # true only behind a load balancer that sets X-Forwarded-For
    analytics:
      enabled: ${PORTICA_ANALYTICS_ENABLED:true}   # publish api events and trace transactions to Kafka
      bootstrap-servers: ${PORTICA_KAFKA_BOOTSTRAP:localhost:9092}
      queue-capacity: 10000                          # events buffered while Kafka is slow; extra ones are dropped
      # gateway-id: defaults to the host name
    oauth:
      token-ttl: 1h                # lifetime of access tokens from POST /{org}/{env}/oauth2/token
    auth:
      token-uri: ${PORTICA_OIDC_TOKEN_URI:http://localhost:8180/realms/portica/protocol/openid-connect/token}
      client-id: ${PORTICA_GATEWAY_CLIENT_ID:portica-gateway}
      client-secret: ${PORTICA_GATEWAY_CLIENT_SECRET:portica-gateway-dev-secret}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,gateway
  endpoint:
    health:
      probes:
        enabled: true
    gateway:
      access: read-only   # /actuator/gateway/routes lists the live route table

logging:
  pattern:
    level: "%5p [${spring.application.name}]"
