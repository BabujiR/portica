server:
  port: 8080
  shutdown: graceful
  error:
    include-stacktrace: never
    include-message: never

spring:
  application:
    name: portica-management
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/portica}
    username: ${PORTICA_DB_USERNAME:portica}
    password: ${PORTICA_DB_PASSWORD:portica}
    hikari:
      maximum-pool-size: 20

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate   # Flyway owns the schema; Hibernate only verifies it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  mvc:
    problemdetails:
      enabled: true

  data:
    web:
      pageable:
        max-page-size: 100

  security:
    oauth2:
      resourceserver:
        jwt:
          # iss claim that tokens must carry
          issuer-uri: ${PORTICA_OIDC_ISSUER:http://localhost:8180/realms/portica}
          # where signing keys are fetched (can differ from the issuer inside docker networks)
          jwk-set-uri: ${PORTICA_OIDC_JWKS:http://localhost:8180/realms/portica/protocol/openid-connect/certs}
          audiences:
            - portica-management

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: Portica Management
    description: The front door to your APIs

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

portica:
  security:
    platform-admin-role: portica-platform-admin
    runtime-role: portica-runtime
    cors-allowed-origins:
      - http://localhost:5173
  organizations:
    default-environments: [dev, test, prod]
  kvm:
    # AES-256 key (base64 of 32 random bytes: openssl rand -base64 32) for encrypted key value maps.
    # Without it, encrypted maps can't be created. Keep it secret and stable: changing it makes
    # existing encrypted values unreadable.
    encryption-key: ${PORTICA_KVM_ENCRYPTION_KEY:}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"
