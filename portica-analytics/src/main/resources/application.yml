server:
  port: 8084
  shutdown: graceful

spring:
  application:
    name: portica-analytics

portica:
  analytics:
    enabled: true
    kafka:
      bootstrap-servers: ${PORTICA_KAFKA_BOOTSTRAP:localhost:9092}
      group-id: portica-analytics
      partitions: 3
      replication-factor: 1
    clickhouse:
      url: ${PORTICA_CLICKHOUSE_URL:http://localhost:8123}
      database: ${PORTICA_CLICKHOUSE_DATABASE:portica_analytics}
      user: ${PORTICA_CLICKHOUSE_USER:portica}
      password: ${PORTICA_CLICKHOUSE_PASSWORD:portica}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"
