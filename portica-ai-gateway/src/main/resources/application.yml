server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: portica-ai-gateway
  data:
    redis:
      host: ${PORTICA_REDIS_HOST:localhost}
      port: ${PORTICA_REDIS_PORT:6379}

portica:
  ai:
    management-url: ${PORTICA_MANAGEMENT_URL:http://localhost:8080}
    environments: ${PORTICA_AI_ENVIRONMENTS:*}          # org/env patterns to serve, e.g. acme/*
    # The gateway adds this header when it forwards to the AI gateway; calls without it are refused.
    # Set the same value as portica.services.internal-token on the management API.
    internal-token: ${PORTICA_INTERNAL_TOKEN:portica-internal-dev-token}
    quota-store: ${PORTICA_AI_QUOTA_STORE:redis}        # redis (shared by instances) or memory
    sync:
      enabled: true
      poll-interval: 5s
      timeout: 10s
    auth:
      # The gateway's Keycloak client also has the portica-runtime role the runtime feed requires
      token-uri: ${PORTICA_OIDC_TOKEN_URI:http://localhost:8180/realms/portica/protocol/openid-connect/token}
      client-id: ${PORTICA_GATEWAY_CLIENT_ID:portica-gateway}
      client-secret: ${PORTICA_GATEWAY_CLIENT_SECRET:portica-gateway-dev-secret}
    analytics:
      enabled: ${PORTICA_ANALYTICS_ENABLED:true}
      bootstrap-servers: ${PORTICA_KAFKA_BOOTSTRAP:localhost:9092}
      queue-capacity: 10000

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false   # quota counting degrades gracefully; don't take the service out of rotation

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"
